[build]
  publish = "."

[[headers]]
  for = "/public/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/raw/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 404
  force = true
